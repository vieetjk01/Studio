name: Build MStudo Desktop (Windows)

# Build file cài đặt Windows (.exe) trên máy ảo Windows của GitHub.
#  - Chạy tay: tab Actions → "Build MStudo Desktop (Windows)" → Run workflow.
#  - Tự chạy khi đẩy tag desktop-v* (vd desktop-v0.4.0) và tạo luôn Release.
on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Cài phụ thuộc npm
        run: npm install

      - name: Build (đóng gói NSIS)
        run: npm run build

      - name: Tải lên artifact (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: MStudo-Desktop-Windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      # Tạo Release công khai kèm file .exe. Khi đẩy tag desktop-v* thì dùng đúng
      # tag đó; khi bấm chạy tay (workflow_dispatch) thì tự tạo/ghi đè tag
      # desktop-v0.4.0 — cách này không cần đẩy tag qua git.
      - name: Tạo Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'desktop-v0.4.0' }}
          name: MStudo Desktop ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'desktop-v0.4.0' }}
          files: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          generate_release_notes: true
